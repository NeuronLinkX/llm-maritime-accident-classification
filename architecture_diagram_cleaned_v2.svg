<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1180" viewBox="0 0 2400 1180" role="img" aria-labelledby="title desc">
<title id="title">LLM 기반 군집 레이블링 아키텍처</title>
<desc id="desc">군집 데이터와 페르소나 자산을 입력받아, 정체성 유무 두 조건으로 3단계 페르소나 체인을 로컬 LLM에서 실행하고, 출력 검증과 정량 비교로 마무리하는 구조</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8FAFC"/><stop offset="1" stop-color="#EEF4FA"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#0F172A" flood-opacity=".09"/></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity=".09"/></filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9.1" markerHeight="9.1" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#64748B"/></marker>
  <marker id="mainArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10.4" markerHeight="10.4" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#2563EB"/></marker>
  <marker id="onArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10.4" markerHeight="10.4" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#4338CA"/></marker>
  <marker id="offArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10.4" markerHeight="10.4" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#B91C1C"/></marker>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR","Segoe UI",sans-serif}
    .section{fill:#fff;stroke-width:2;filter:url(#shadow)}
    .card{fill:#fff;stroke:#D6E0EA;stroke-width:1.5;filter:url(#soft)}
    .title{font-size:16px;font-weight:800;fill:#172033}
    .sub{font-size:12.5px;font-weight:550;fill:#64748B}
    .st{font-size:20px;font-weight:850;fill:#0F172A}
    .ss{font-size:12px;font-weight:750;letter-spacing:1px}
    .num{font-size:15px;font-weight:850;fill:#fff;text-anchor:middle}
    /* color grammar: blue = backbone flow between numbered stages; gray solid = wiring inside a stage;
       gray dashed = config/근거 결합; indigo = identity_on 경로; red = identity_off 경로 */
    .edge{fill:none;stroke:#94A3B8;stroke-width:1.7;marker-end:url(#arrow)}
    .softEdge{fill:none;stroke:#94A3B8;stroke-width:1.5;stroke-dasharray:6 6;marker-end:url(#arrow)}
    .mainEdge{fill:none;stroke:#2563EB;stroke-width:2.6;marker-end:url(#mainArrow)}
    .onEdge{fill:none;stroke:#4338CA;stroke-width:2.2;marker-end:url(#onArrow)}
    .offEdge{fill:none;stroke:#B91C1C;stroke-width:2.2;marker-end:url(#offArrow)}
    .routeLabel{font-size:12px;font-weight:850}
  </style>
</defs>
<rect width="2400" height="1180" fill="url(#bg)"/>
<circle cx="2250" cy="-20" r="300" fill="#DBEAFE" opacity=".5"/><circle cx="80" cy="1160" r="230" fill="#CCFBF1" opacity=".4"/>
<text x="70" y="60" font-size="16" font-weight="800" fill="#2563EB" letter-spacing="2.5">LLM baseline · PERSONA-BASED CLUSTER LABELING</text>
<text x="70" y="108" font-size="38" font-weight="880" fill="#172033">군집 기반 사고원인 레이블링 아키텍처</text>
<text x="70" y="142" font-size="17" fill="#64748B">군집 데이터와 3종 페르소나를 입력받아, 정체성 유무 두 조건으로 동일한 3단계 체인을 로컬 LLM에서 실행하고 비교한다</text>
<line x1="70" y1="172" x2="2330" y2="172" stroke="#CBD5E1" stroke-width="2"/>

<!-- section panels: 6 sections, single row -->
<rect class="section" x="50" y="200" width="260" height="940" rx="25" stroke="#93C5FD"/>
<rect class="section" x="335" y="200" width="330" height="940" rx="25" stroke="#5EEAD4"/>
<rect class="section" x="690" y="200" width="290" height="940" rx="25" stroke="#C4B5FD"/>
<rect class="section" x="1005" y="200" width="560" height="940" rx="25" stroke="#A5B4FC"/>
<rect class="section" x="1590" y="200" width="330" height="940" rx="25" stroke="#FDA4AF"/>
<rect class="section" x="1945" y="200" width="405" height="940" rx="25" stroke="#FCD34D"/>

<!-- headers -->
<g><circle cx="85" cy="245" r="20" fill="#2563EB"/><text class="num" x="85" y="251">1</text><text class="st" x="117" y="240">입력 자산</text><text class="ss" x="117" y="266" fill="#2563EB">CLUSTER &amp; CORPUS INPUT</text></g>
<g><circle cx="370" cy="245" r="20" fill="#0D9488"/><text class="num" x="370" y="251">2</text><text class="st" x="402" y="240">페르소나 준비</text><text class="ss" x="402" y="266" fill="#0D9488">PERSONA &amp; TAXONOMY PREP</text></g>
<g><circle cx="725" cy="245" r="20" fill="#7C3AED"/><text class="num" x="725" y="251">3</text><text class="st" x="757" y="240">군집 프롬프트 구성</text><text class="ss" x="757" y="266" fill="#7C3AED">PROMPT ASSEMBLY</text></g>
<g><circle cx="1040" cy="245" r="20" fill="#4F46E5"/><text class="num" x="1040" y="251">4</text><text class="st" x="1072" y="240">페르소나 체인 실행</text><text class="ss" x="1072" y="266" fill="#4F46E5">LOCAL PERSONA CHAIN</text></g>
<g><circle cx="1625" cy="245" r="20" fill="#E11D48"/><text class="num" x="1625" y="251">5</text><text class="st" x="1657" y="240">출력 검증</text><text class="ss" x="1657" y="266" fill="#E11D48">SCHEMA VALIDATION</text></g>
<g><circle cx="1980" cy="245" r="20" fill="#D97706"/><text class="num" x="1980" y="251">6</text><text class="st" x="2012" y="240">정량 분석·리포트</text><text class="ss" x="2012" y="266" fill="#D97706">ABLATION &amp; REPORT</text></g>

<!-- Section 1: input assets -->
<g>
  <rect class="card" x="75" y="300" width="210" height="105" rx="16"/><rect x="75" y="300" width="6" height="105" rx="3" fill="#2563EB"/>
  <text class="title" x="98" y="335">군집 결과</text><text class="sub" x="98" y="360">K-means 군집 5개</text><text class="sub" x="98" y="380">(문서 818건 → 5개 그룹)</text>
  <rect class="card" x="75" y="425" width="210" height="105" rx="16"/><rect x="75" y="425" width="6" height="105" rx="3" fill="#3B82F6"/>
  <text class="title" x="98" y="460">군집 키워드</text><text class="sub" x="98" y="485">빈도 상위·특징 상위</text><text class="sub" x="98" y="505">군집별 통계</text>
  <rect class="card" x="75" y="550" width="210" height="105" rx="16"/><rect x="75" y="550" width="6" height="105" rx="3" fill="#60A5FA"/>
  <text class="title" x="98" y="585">대표 문장 원문</text><text class="sub" x="98" y="610">군집별 표본 문서의</text><text class="sub" x="98" y="630">사고 경위 발췌</text>
  <rect class="card" x="75" y="675" width="210" height="105" rx="16"/><rect x="75" y="675" width="6" height="105" rx="3" fill="#93C5FD"/>
  <text class="title" x="98" y="710">법령·행정규칙 코퍼스</text><text class="sub" x="98" y="735">해양안전심판원 관련</text><text class="sub" x="98" y="755">법령 10종 + 국제기준</text>
</g>

<!-- Section 2: persona & taxonomy prep -->
<g>
  <rect class="card" x="360" y="300" width="280" height="115" rx="16"/><text class="title" x="384" y="335">페르소나 3종 정의</text><text class="sub" x="384" y="360">사실·증거 구조화</text><text class="sub" x="384" y="380">인과관계·법령 검증</text><text class="sub" x="384" y="400">원인기여도·레이블링</text>
  <rect class="card" x="360" y="430" width="280" height="95" rx="16"/><text class="title" x="384" y="463">정체성 선언 표시</text><text class="sub" x="384" y="488">"이 페르소나는 ~이다" 문구를</text><text class="sub" x="384" y="506">본문과 분리해 표시</text>
  <rect x="360" y="540" width="280" height="130" rx="19" fill="#F0FDFA" stroke="#2DD4BF" stroke-width="2.5" filter="url(#soft)"/>
  <text x="384" y="572" font-size="17" font-weight="850" fill="#0F766E">정체성 유무 버전 생성</text>
  <text class="sub" x="384" y="598">정체성 포함본 · 정체성 제거본</text>
  <text class="sub" x="384" y="618">두 버전을 만들고, 정체성 부분</text>
  <text class="sub" x="384" y="638">외에는 완전히 동일한지 검증</text>
  <text class="sub" x="384" y="658">(무결성 확인 실패 시 중단)</text>
  <rect class="card" x="360" y="695" width="280" height="90" rx="16"/><text class="title" x="384" y="726">KMST 공식 분류체계</text><text class="sub" x="384" y="750">사고원인 대분류·세부항목</text><text class="sub" x="384" y="768">(최종 레이블 후보 목록)</text>
</g>

<!-- Section 3: prompt assembly -->
<g>
  <rect class="card" x="715" y="300" width="240" height="95" rx="16"/><text class="title" x="738" y="333">군집 컨텍스트 결합</text><text class="sub" x="738" y="358">키워드 + 대표 문장을</text><text class="sub" x="738" y="376">하나의 입력으로 구성</text>
  <rect class="card" x="715" y="410" width="240" height="95" rx="16"/><text class="title" x="738" y="443">관련 법령 근거 검색</text><text class="sub" x="738" y="468">군집 내용과 관련된</text><text class="sub" x="738" y="486">조문을 근사 검색해 첨부</text>
  <rect class="card" x="715" y="520" width="240" height="95" rx="16"/><text class="title" x="738" y="553">이전 단계 결과 연결</text><text class="sub" x="738" y="578">체인 상 앞 페르소나의</text><text class="sub" x="738" y="596">출력을 다음 입력에 포함</text>
  <rect class="card" x="715" y="630" width="240" height="95" rx="16"/><text class="title" x="738" y="663">후보 레이블 결합</text><text class="sub" x="738" y="688">최종 단계에서만</text><text class="sub" x="738" y="706">KMST 분류체계 첨부</text>
  <rect x="715" y="745" width="240" height="80" rx="18" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2.5" filter="url(#soft)"/>
  <text x="738" y="778" font-size="16" font-weight="850" fill="#6D28D9">군집 단위 프롬프트</text>
  <text class="sub" x="738" y="802">군집 5개 × 조건 2개 조립</text>
</g>

<!-- Section 4: persona chain execution (biggest section, on/off branch) -->
<g>
  <!-- condition split -->
  <rect x="1030" y="300" width="230" height="55" rx="14" fill="#EEF2FF" stroke="#4338CA" stroke-width="2.5" filter="url(#soft)"/>
  <text x="1145" y="333" font-size="16" font-weight="850" fill="#3730A3" text-anchor="middle">조건 A · 정체성 포함</text>
  <rect x="1290" y="300" width="230" height="55" rx="14" fill="#FEF2F2" stroke="#B91C1C" stroke-width="2.5" filter="url(#soft)"/>
  <text x="1405" y="333" font-size="16" font-weight="850" fill="#991B1B" text-anchor="middle">조건 B · 정체성 제거</text>

  <!-- identical 3-stage chain under each condition -->
  <rect class="card" x="1030" y="380" width="230" height="88" rx="14"/><text class="title" x="1050" y="410" font-size="15">① 사실·패턴 구조화</text><text class="sub" x="1050" y="434">군집 대표 문장에서</text><text class="sub" x="1050" y="452">반복되는 사실·증거 추출</text>
  <rect class="card" x="1290" y="380" width="230" height="88" rx="14"/><text class="title" x="1310" y="410" font-size="15">① 사실·패턴 구조화</text><text class="sub" x="1310" y="434">동일 작업, 정체성 문구만 없음</text>

  <rect class="card" x="1030" y="495" width="230" height="88" rx="14"/><text class="title" x="1050" y="525" font-size="15">② 원인 후보 검증</text><text class="sub" x="1050" y="549">추출된 사실을 바탕으로</text><text class="sub" x="1050" y="567">대표 원인의 인과·법령 정합성 확인</text>
  <rect class="card" x="1290" y="495" width="230" height="88" rx="14"/><text class="title" x="1310" y="525" font-size="15">② 원인 후보 검증</text><text class="sub" x="1310" y="549">동일 작업, 정체성 문구만 없음</text>

  <rect class="card" x="1030" y="610" width="230" height="88" rx="14"/><text class="title" x="1050" y="640" font-size="15">③ 레이블 확정</text><text class="sub" x="1050" y="664">검증된 원인을 KMST</text><text class="sub" x="1050" y="682">공식 분류체계에 매핑</text>
  <rect class="card" x="1290" y="610" width="230" height="88" rx="14"/><text class="title" x="1310" y="640" font-size="15">③ 레이블 확정</text><text class="sub" x="1310" y="664">동일 작업, 정체성 문구만 없음</text>

  <!-- local inference engine: 두 조건이 하나로 합류하는 공유 박스 (좌우 대칭 진입) -->
  <rect x="1030" y="750" width="490" height="150" rx="18" fill="#EEF2FF" stroke="#6366F1" stroke-width="2.5" filter="url(#soft)"/>
  <text x="1275" y="782" font-size="16" font-weight="850" fill="#3730A3" text-anchor="middle">단일 로컬 모델 추론 (조건 A·B 공유)</text>
  <text class="sub" x="1052" y="810">외부 API 호출 없음</text>
  <text class="sub" x="1052" y="832">결정론적 디코딩(재현성 우선)</text>
  <text class="sub" x="1052" y="854">과도한 반복 생성 억제</text>
  <text class="sub" x="1052" y="876">항목을 하나씩 순차 처리</text>
</g>

<!-- Section 5: output validation -->
<g>
  <rect class="card" x="1615" y="300" width="280" height="95" rx="16"/><circle cx="1650" cy="333" r="17" fill="#FFE4E6"/><text x="1650" y="339" font-size="13" font-weight="850" fill="#BE123C" text-anchor="middle">1</text><text class="title" x="1677" y="339" font-size="15">응답에서 JSON 추출</text>
  <rect class="card" x="1615" y="410" width="280" height="95" rx="16"/><circle cx="1650" cy="443" r="17" fill="#FFE4E6"/><text x="1650" y="449" font-size="13" font-weight="850" fill="#BE123C" text-anchor="middle">2</text><text class="title" x="1677" y="449" font-size="15">출력 스키마 적합성 검사</text>
  <rect class="card" x="1615" y="520" width="280" height="95" rx="16"/><circle cx="1650" cy="553" r="17" fill="#FFE4E6"/><text x="1650" y="559" font-size="13" font-weight="850" fill="#BE123C" text-anchor="middle">3</text><text class="title" x="1677" y="559" font-size="15">분류체계 준수 여부 확인</text>
  <path d="M1755 660L1830 715L1755 770L1680 715Z" fill="#FFF1F2" stroke="#FB7185" stroke-width="3" filter="url(#soft)"/>
