<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1500" viewBox="0 0 2400 1500" role="img" aria-labelledby="title desc">
<title id="title">해양사고 분류 멀티 모델 아키텍처</title>
<desc id="desc">공통 데이터, 컨텍스트, 프롬프트 처리 후 OpenAI Cloud 또는 Local LLM으로 분기하고 공통 출력 검증으로 합류하는 구조</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8FAFC"/><stop offset="1" stop-color="#EEF4FA"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#0F172A" flood-opacity=".09"/></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity=".09"/></filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9.1" markerHeight="9.1" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#64748B"/></marker>
  <marker id="mainArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10.4" markerHeight="10.4" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#2563EB"/></marker>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR","Segoe UI",sans-serif}
    .section{fill:#fff;stroke-width:2;filter:url(#shadow)}
    .card{fill:#fff;stroke:#D6E0EA;stroke-width:1.5;filter:url(#soft)}
    .title{font-size:18px;font-weight:800;fill:#172033}
    .sub{font-size:14px;font-weight:550;fill:#64748B}
    .code{font-family:"SFMono-Regular",Consolas,monospace;font-size:14px;fill:#334155;font-weight:600}
    .st{font-size:22px;font-weight:850;fill:#0F172A}
    .ss{font-size:13px;font-weight:750;letter-spacing:1.1px}
    .num{font-size:16px;font-weight:850;fill:#fff;text-anchor:middle}
    /* color grammar: blue = backbone flow between the 6 numbered stages; gray solid = wiring inside a stage; gray dashed = config/parameter injection inside a stage */
    .edge{fill:none;stroke:#94A3B8;stroke-width:1.8;marker-end:url(#arrow)}
    .softEdge{fill:none;stroke:#94A3B8;stroke-width:1.6;stroke-dasharray:6 6;marker-end:url(#arrow)}
    .mainEdge{fill:none;stroke:#2563EB;stroke-width:2.8;marker-end:url(#mainArrow)}
    .branchEdge{fill:none;stroke:#2563EB;stroke-width:2.6;marker-end:url(#mainArrow)}
    .routeLabel{font-size:13px;font-weight:850;fill:#2563EB}
  </style>
</defs>
<rect width="2400" height="1500" fill="url(#bg)"/>
<circle cx="2250" cy="-20" r="330" fill="#DBEAFE" opacity=".5"/><circle cx="80" cy="1490" r="270" fill="#CCFBF1" opacity=".4"/>
<text x="70" y="68" font-size="17" font-weight="800" fill="#2563EB" letter-spacing="2.5">MULTI-MODEL CLASSIFICATION PIPELINE</text>
<text x="70" y="120" font-size="42" font-weight="880" fill="#172033">해양사고 원인 분류 멀티 모델 아키텍처</text>
<text x="70" y="158" font-size="19" fill="#64748B">공통 Grounding과 Prompt Builder를 거쳐 Cloud·Local 모델로 분기하고, 단일 Output Guardrail로 응답을 표준화</text>
<line x1="70" y1="194" x2="2330" y2="194" stroke="#CBD5E1" stroke-width="2"/>

<!-- section panels -->
