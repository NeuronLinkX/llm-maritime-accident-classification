  <rect x="1615" y="800" width="130" height="90" rx="16" fill="#ECFDF5" stroke="#34D399" stroke-width="2.5" filter="url(#soft)"/>
  <text x="1638" y="836" font-size="15" font-weight="850" fill="#047857">레이블</text><text x="1638" y="858" font-size="15" font-weight="850" fill="#047857">확정 저장</text>
  <rect x="1765" y="800" width="130" height="90" rx="16" fill="#FFF7ED" stroke="#FB923C" stroke-width="2.5" filter="url(#soft)"/>
  <text x="1788" y="836" font-size="15" font-weight="850" fill="#C2410C">실패로</text><text x="1788" y="858" font-size="15" font-weight="850" fill="#C2410C">기록(재시도 없음)</text>
</g>

<!-- Section 6: analysis & report -->
<g>
  <rect class="card" x="1970" y="300" width="355" height="95" rx="16"/><text class="title" x="1992" y="333">재현성 확인</text><text class="sub" x="1992" y="358">동일 입력을 다시 실행해</text><text class="sub" x="1992" y="376">같은 결과가 나오는지 점검</text>
  <rect class="card" x="1970" y="410" width="355" height="115" rx="16"/><text class="title" x="1992" y="443">조건 간 비교 (핵심)</text><text class="sub" x="1992" y="468">정체성 포함/제거 결과를 군집별로</text><text class="sub" x="1992" y="486">대응비교 — 레이블 변화율·전이 방향·</text><text class="sub" x="1992" y="504">유효성·출력 길이 차이를 통계로 확인</text>
  <rect class="card" x="1970" y="540" width="355" height="90" rx="16"/><text class="title" x="1992" y="573">체인 단계별 특성</text><text class="sub" x="1992" y="598">단계별 성공률·산출량·</text><text class="sub" x="1992" y="616">분류체계 준수율 요약</text>
  <rect x="1970" y="645" width="355" height="130" rx="19" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2.5" filter="url(#soft)"/>
  <text x="1992" y="678" font-size="17" font-weight="850" fill="#92400E">최종 리포트</text>
  <text class="sub" x="1992" y="704">군집별 최종 레이블 + 근거</text>
  <text class="sub" x="1992" y="724">조건 비교 결과와 한계 명시</text>
  <text class="sub" x="1992" y="744">표·그림 포함 산출물</text>
  <rect class="card" x="1970" y="790" width="355" height="90" rx="16"/><text class="title" x="1992" y="823">알려진 한계 기록</text><text class="sub" x="1992" y="848">단일 실행 기반 비교라는 점,</text><text class="sub" x="1992" y="866">군집 근사 방식의 제약을 명시</text>
</g>

<!-- connectors: color grammar, section-to-section backbone -->
<g id="connectors">
  <!-- Section 1 -> Section 2 -->
  <path class="mainEdge" d="M285 470H320V420H355"/>
  <!-- Section 2 -> Section 3 -->
  <path class="mainEdge" d="M640 605H675V495H710"/>
  <!-- Section 3 -> Section 4 -->
  <path class="mainEdge" d="M955 615H985V430H1025"/>
  <!-- Section 4 internal: condition -> stage1 -->
  <path class="onEdge" d="M1145 355V378"/>
  <path class="offEdge" d="M1405 355V378"/>
  <!-- stage chain inside each condition -->
  <path class="onEdge" d="M1145 468V493"/>
  <path class="offEdge" d="M1405 468V493"/>
