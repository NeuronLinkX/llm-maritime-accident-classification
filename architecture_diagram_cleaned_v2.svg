<g><circle cx="370" cy="270" r="21" fill="#0D9488"/><text class="num" x="370" y="276">2</text><text class="st" x="403" y="265">Grounding &amp; Context</text><text class="ss" x="403" y="292" fill="#0D9488">CONTEXT ENGINEERING</text></g>
<g><circle cx="815" cy="270" r="21" fill="#7C3AED"/><text class="num" x="815" y="276">3</text><text class="st" x="848" y="265">Prompt Engineering</text><text class="ss" x="848" y="292" fill="#7C3AED">COMMON PROMPT</text></g>
<g><circle cx="1215" cy="270" r="21" fill="#4F46E5"/><text class="num" x="1215" y="276">4</text><text class="st" x="1248" y="265">Gateway</text><text class="ss" x="1248" y="292" fill="#4F46E5">MODEL ROUTER</text></g>
<g><circle cx="1470" cy="270" r="21" fill="#D97706"/><text class="num" x="1470" y="276">5A</text><text class="st" x="1503" y="265">OpenAI Cloud</text><text class="ss" x="1503" y="292" fill="#D97706">CLOUD INFERENCE</text></g>
<g><circle cx="1470" cy="895" r="21" fill="#0891B2"/><text class="num" x="1470" y="901">5B</text><text class="st" x="1503" y="890">Local LLM</text><text class="ss" x="1503" y="917" fill="#0891B2">DGXSPARK</text></g>
<g><circle cx="1905" cy="270" r="21" fill="#E11D48"/><text class="num" x="1905" y="276">6</text><text class="st" x="1938" y="265">Output Guardrail</text><text class="ss" x="1938" y="292" fill="#E11D48">COMMON VALIDATION</text></g>

<!-- connectors: color grammar applied consistently, every path anchored to true box edges, zero box crossings -->
