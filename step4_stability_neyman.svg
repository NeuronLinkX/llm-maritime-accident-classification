<svg width="1000" height="400" viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Neyman 배분(군집별 8/10/5/15/3건) 설정의 STEP4 모델별·군집별 라벨 재현성(100회 실행)</title>
<desc>3개 모델(Qwen2.5-3B/14B, Llama-3.1-8B, 7B는 응답 지연으로 제외)을 군집별 특징도 기반 Neyman 최적 배분 표본으로 100회 실행한 결과. 군집0은 3개 모델 모두 100%로 완전히 안정됐지만, 14B는 군집1·2·3에서 40~70% 구간으로 떨어져 이전보다 불안정해진 조합도 있다.</desc>
<rect width="1000" height="400" fill="#FFFFFF"/>
<style>
  text { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; fill: #1B2431; }
  .hdr { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.75; }
  .hdrtxt { font-size: 14px; font-weight: 700; text-anchor: middle; }
  .lblcell { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.75; }
  .lbltxt { font-size: 15px; font-weight: 700; text-anchor: middle; }
  .cell-g { fill: #E2F0D9; stroke: #8FAE7E; stroke-width: 0.75; }
  .cell-o { fill: #FBE5C8; stroke: #C99A55; stroke-width: 0.75; }
  .label { font-size: 14.5px; font-weight: 700; text-anchor: middle; }
  .label-g { fill: #2F5D34; }
  .label-o { fill: #8A5A1C; }
  .sub { font-size: 12px; text-anchor: middle; }
  .sub-g { fill: #4C7A44; }
  .sub-o { fill: #A6763A; }
  .cap { font-size: 15px; text-anchor: middle; fill: #2C2C2A; }
</style>

