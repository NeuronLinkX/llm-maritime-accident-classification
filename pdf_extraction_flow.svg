<svg width="680" height="688" viewBox="0 0 680 688" xmlns="http://www.w3.org/2000/svg" role="img">
<title>PDF 텍스트 확보 단계별 흐름</title>
<desc>PDF에서 이미 저장된 글자를 그대로 읽는 1단계를 먼저 시도하고, 충분하면 4단계로 바로 건너뛰며, 부족하면 PaddleOCR(2단계), 그래도 부족하면 OCRmyPDF(3단계)까지 순차적으로 시도한 뒤, 확보한 글자를 임시 HWPX로 포장하는 4단계로 모두 수렴한다.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5B5876" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect width="680" height="688" fill="#FFFFFF"/>

<!-- Box1: 1단계 native -->
<rect x="190" y="40" width="300" height="66" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="340" y="62" text-anchor="middle" dominant-baseline="central" font-family="Malgun Gothic, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">1단계 · 저장된 글자 그대로 읽기</text>
<text x="340" y="82" text-anchor="middle" dominant-baseline="central" font-family="Malgun Gothic, sans-serif" font-size="12" fill="#5F5E5A">진짜 텍스트 PDF면 바로 성공</text>
<line x1="340" y1="106" x2="340" y2="128" stroke="#5B5876" stroke-width="0.75" marker-end="url(#arrow)"/>

<!-- D1: decision -->
<rect x="170" y="130" width="340" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.75"/>
<text x="340" y="150" text-anchor="middle" dominant-baseline="central" font-family="Malgun Gothic, sans-serif" font-size="14" font-weight="600" fill="#412402">충분히 잘 뽑혔는가?</text>
<text x="340" y="168" text-anchor="middle" dominant-baseline="central" font-family="Malgun Gothic, sans-serif" font-size="12" fill="#633806">4개 항목 완성 + 글자 수 충분?</text>

<!-- D1 Yes: skip to Box4, dedicated lane x=600, vertical entry into box4 -->
<path d="M510 150 L600 150 L600 513 L480 513 L480 520" fill="none" stroke="#5B5876" stroke-width="0.75" marker-end="url(#arrow)"/>
<text x="565" y="145" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="12" fill="#5B5876">예 — 2·3단계 건너뜀</text>

<!-- D1 No: down to Box2 -->
<line x1="340" y1="186" x2="340" y2="228" stroke="#5B5876" stroke-width="0.75" marker-end="url(#arrow)"/>
<text x="350" y="210" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="12" fill="#5B5876">아니오</text>

<!-- Box2: 2단계 PaddleOCR -->
<rect x="190" y="230" width="300" height="66" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="340" y="252" text-anchor="middle" dominant-baseline="central" font-family="Malgun Gothic, sans-serif" font-size="14" font-weight="600" fill="#04342C">2단계 · PaddleOCR (1차)</text>
<text x="340" y="272" text-anchor="middle" dominant-baseline="central" font-family="Malgun Gothic, sans-serif" font-size="12" fill="#085041">페이지를 사진으로 바꿔 글자 인식</text>
<line x1="340" y1="296" x2="340" y2="324" stroke="#5B5876" stroke-width="0.75" marker-end="url(#arrow)"/>

<!-- D2: decision -->
<rect x="190" y="326" width="300" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.75"/>
<text x="340" y="346" text-anchor="middle" dominant-baseline="central" font-family="Malgun Gothic, sans-serif" font-size="14" font-weight="600" fill="#412402">여전히 부족한가?</text>
<text x="340" y="364" text-anchor="middle" dominant-baseline="central" font-family="Malgun Gothic, sans-serif" font-size="12" fill="#633806">PaddleOCR 결과 점검</text>

<!-- D2 Yes: down to Box3 -->
<line x1="340" y1="382" x2="340" y2="410" stroke="#5B5876" stroke-width="0.75" marker-end="url(#arrow)"/>
<text x="350" y="398" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="12" fill="#5B5876">예</text>

<!-- D2 No: skip to Box4, dedicated lane x=545, vertical entry into box4 -->
<path d="M490 350 L545 350 L545 505 L420 505 L420 520" fill="none" stroke="#5B5876" stroke-width="0.75" marker-end="url(#arrow)"/>
<text x="535" y="345" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="12" fill="#5B5876">아니오 — 3단계 건너뜀</text>

<!-- Box3: 3단계 OCRmyPDF -->
<rect x="190" y="412" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="340" y="432" text-anchor="middle" dominant-baseline="central" font-family="Malgun Gothic, sans-serif" font-size="14" font-weight="600" fill="#04342C">3단계 · OCRmyPDF (2차)</text>
<text x="340" y="450" text-anchor="middle" dominant-baseline="central" font-family="Malgun Gothic, sans-serif" font-size="12" fill="#085041">다른 OCR 프로그램으로 재시도</text>
<line x1="340" y1="468" x2="340" y2="520" stroke="#5B5876" stroke-width="0.75" marker-end="url(#arrow)"/>

<!-- Box4: 4단계 -->
<rect x="170" y="522" width="340" height="66" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="340" y="544" text-anchor="middle" dominant-baseline="central" font-family="Malgun Gothic, sans-serif" font-size="14" font-weight="600" fill="#26215C">4단계 · 임시 HWPX로 포장</text>
<text x="340" y="564" text-anchor="middle" dominant-baseline="central" font-family="Malgun Gothic, sans-serif" font-size="12" fill="#3C3489">확보한 글자를 HWPX인 척 담기</text>

<!-- Loop-back note -->
<line x1="340" y1="588" x2="340" y2="610" stroke="#5B5876" stroke-width="0.75" marker-end="url(#arrow)"/>
<rect x="120" y="612" width="440" height="56" rx="8" fill="#F7F6FB" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="340" y="631" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="12" fill="#444441">↻ ② 단계로 되돌아가 이 프로그램을 다시 실행</text>
<text x="340" y="650" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="12" fill="#444441">이번엔 HWPX로 인식되어 ③-A → ④ 순서를 그대로 탐</text>
</svg>
