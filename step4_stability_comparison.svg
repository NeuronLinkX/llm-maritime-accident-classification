<svg width="900" height="480" viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" role="img">
<title>레거시(대표문장 균일 3건) 대비 Neyman 배분 표본의 군집별 라벨 안정성 비교</title>
<desc>3개 공통 모델(Qwen2.5-3B, Qwen2.5-14B, Llama-3.1-8B)의 100회 실행 평균 안정성 비율을 군집별로 비교한 덤벨 차트. 전체 평균은 81.9%에서 81.6%로 거의 변화가 없지만, 군집0은 86%에서 100%로 개선되고 군집4는 98%에서 80.7%로 악화되는 등 군집별로 방향이 엇갈린다.</desc>
<defs>
<marker id="arrowStab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#111111"/>
</marker>
</defs>
<rect width="900" height="480" fill="#FFFFFF"/>
<style>
  text { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; fill: #1B2431; }
  .lbl { font-size: 16px; font-weight: 700; }
  .val { font-size: 13px; font-weight: 700; }
  .valOld { fill: #52514E; }
  .valNew { fill: #123B4A; }
  .grid { stroke: #E1E0D9; stroke-width: 1; }
  .axis { fill: #6B6A66; font-size: 12px; }
  .connector { stroke: #C3C2B7; stroke-width: 2.5; }
  .delta-up { fill: #0F6E56; font-size: 14px; font-weight: 700; }
  .delta-down { fill: #99372B; font-size: 14px; font-weight: 700; }
  .stat-label { fill: #6B6A66; font-size: 13px; }
  .stat-num { font-size: 28px; font-weight: 700; }
  .cap { font-size: 15px; text-anchor: middle; fill: #2C2C2A; }
</style>

<text x="30" y="36" class="stat-label">레거시(대표문장 균일 3건) 전체 평균</text>
<text x="30" y="66" class="stat-num valOld">81.9%</text>

<text x="330" y="36" class="stat-label">Neyman 배분 전체 평균</text>
<text x="330" y="66" class="stat-num valNew">81.6%</text>

<text x="630" y="36" class="stat-label">변화</text>
<text x="630" y="66" class="stat-num delta-down">-0.3%p</text>

<line x1="20" y1="90" x2="880" y2="90" stroke="#5F5E5A" stroke-width="1"/>

<line x1="130" y1="110" x2="130" y2="420" class="grid"/>
<line x1="300" y1="110" x2="300" y2="420" class="grid"/>
<line x1="470" y1="110" x2="470" y2="420" class="grid"/>
<line x1="640" y1="110" x2="640" y2="420" class="grid"/>
<line x1="810" y1="110" x2="810" y2="420" class="grid"/>
<text x="130" y="436" class="axis" text-anchor="middle">0%</text>
<text x="300" y="436" class="axis" text-anchor="middle">25%</text>
<text x="470" y="436" class="axis" text-anchor="middle">50%</text>
<text x="640" y="436" class="axis" text-anchor="middle">75%</text>
<text x="810" y="436" class="axis" text-anchor="middle">100%</text>

<g>
<text x="20" y="132" class="lbl">군집 0</text>
<line x1="695.8" y1="136" x2="810" y2="136" class="connector"/>
<circle cx="695.8" cy="136" r="8" fill="#B5D4F4" stroke="#123B4A" stroke-width="1"/>
<circle cx="810" cy="136" r="8" fill="#123B4A"/>
<text x="695.8" y="118" class="val valOld" text-anchor="middle">86.0%</text>
<text x="810" y="118" class="val valNew" text-anchor="middle">100.0%</text>
<text x="822" y="140" class="delta-up">▲ +14.0</text>
</g>

<g>
<text x="20" y="196" class="lbl">군집 1</text>
<line x1="665.5" y1="200" x2="679.7" y2="200" class="connector"/>
<circle cx="665.5" cy="200" r="8" fill="#B5D4F4" stroke="#123B4A" stroke-width="1"/>
<circle cx="679.7" cy="200" r="8" fill="#123B4A"/>
<text x="665.5" y="182" class="val valOld" text-anchor="middle">79.7%</text>
<text x="694" y="204" class="val valNew" text-anchor="start">82.3%</text>
<text x="822" y="204" class="delta-up">▲ +2.7</text>
</g>

<g>
<text x="20" y="260" class="lbl">군집 2</text>
<line x1="662.4" y1="264" x2="665.5" y2="264" class="connector"/>
<circle cx="662.4" cy="264" r="8" fill="#123B4A"/>
<circle cx="665.5" cy="264" r="8" fill="#B5D4F4" stroke="#123B4A" stroke-width="1"/>
<text x="630" y="246" class="val valNew" text-anchor="end">76.7%</text>
<text x="680" y="268" class="val valOld" text-anchor="start">79.3%</text>
<text x="822" y="268" class="delta-down">▼ -2.7</text>
</g>

<g>
<text x="20" y="324" class="lbl">군집 3</text>
<line x1="583.4" y1="328" x2="596.6" y2="328" class="connector"/>
<circle cx="583.4" cy="328" r="8" fill="#B5D4F4" stroke="#123B4A" stroke-width="1"/>
<circle cx="596.6" cy="328" r="8" fill="#123B4A"/>
<text x="570" y="310" class="val valOld" text-anchor="end">66.7%</text>
<text x="611" y="332" class="val valNew" text-anchor="start">68.3%</text>
<text x="822" y="332" class="delta-up">▲ +1.7</text>
</g>

<g>
<text x="20" y="388" class="lbl">군집 4</text>
<line x1="549.3" y1="392" x2="792.6" y2="392" class="connector"/>
<circle cx="549.3" cy="392" r="8" fill="#123B4A"/>
<circle cx="792.6" cy="392" r="8" fill="#B5D4F4" stroke="#123B4A" stroke-width="1"/>
<text x="549.3" y="414" class="val valNew" text-anchor="middle">80.7%</text>
<text x="792.6" y="414" class="val valOld" text-anchor="middle">98.0%</text>
<text x="822" y="396" class="delta-down">▼ -17.3</text>
</g>

<g transform="translate(20,458)">
<circle cx="8" cy="-4" r="7" fill="#B5D4F4" stroke="#123B4A" stroke-width="1"/>
<text x="22" y="0" class="axis">레거시(대표문장 균일 3건, 4모델)</text>
<circle cx="248" cy="-4" r="7" fill="#123B4A"/>
<text x="262" y="0" class="axis">Neyman 배분(현재, 3모델)</text>
</g>

</svg>
