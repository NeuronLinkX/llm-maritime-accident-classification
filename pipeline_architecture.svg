<svg width="640" height="723" viewBox="0 0 640 723" xmlns="http://www.w3.org/2000/svg" role="img">
<title>body_decoder 5단계 처리 흐름 (분기 조건 명시)</title>
<desc>② 파일 형식 확인 단계에서 판별된 형식에 따라 HWP/HWPX 경로와 PDF 경로로 명시적으로 분기되며, 두 경로가 공통 후처리로 합류하여 JSON을 출력하는 흐름도.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5B5876" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect width="640" height="723" fill="#FFFFFF"/>

<!-- Box1 -->
<rect x="150" y="30" width="340" height="72" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="166" y="51" font-family="Malgun Gothic, sans-serif" font-size="14" font-weight="700" fill="#2C2C2A">① 입력 파일</text>
<text x="166" y="73" font-family="Malgun Gothic, sans-serif" font-size="12.5" fill="#3A3A38">.hwp 또는 .hwpx 또는 .pdf 중 하나</text>
<line x1="320" y1="102" x2="320" y2="124" stroke="#5B5876" stroke-width="0.75" marker-end="url(#arrow)"/>

<!-- Box2 -->
<rect x="100" y="124" width="440" height="130" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="116" y="146" font-family="Malgun Gothic, sans-serif" font-size="14" font-weight="700" fill="#2C2C2A">② 파일 형식 확인 (자동 판별)</text>
<text x="116" y="170" font-family="Malgun Gothic, sans-serif" font-size="12.5" fill="#3A3A38">파일 확장자가 아니라, 파일의 맨 앞 몇 바이트</text>
<text x="116" y="192" font-family="Malgun Gothic, sans-serif" font-size="12.5" fill="#3A3A38">(모든 hwp/hwpx/pdf 파일이 공통으로 갖는</text>
<text x="116" y="214" font-family="Malgun Gothic, sans-serif" font-size="12.5" fill="#3A3A38">고유 표시)를 직접 읽어서 무슨 형식인지 확인함</text>

<!-- branch stem -->
<line x1="320" y1="254" x2="320" y2="270" stroke="#5B5876" stroke-width="0.75"/>

<!-- branch arrows with explicit condition labels -->
<path d="M320 270 L170 270 L170 330" fill="none" stroke="#0F6E56" stroke-width="0.9" marker-end="url(#arrow)"/>
<rect x="112" y="276" width="116" height="22" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="170" y="288" text-anchor="middle" dominant-baseline="central" font-family="Malgun Gothic, sans-serif" font-size="11.5" font-weight="600" fill="#0A4A3D">HWP·HWPX로 판별</text>

<path d="M320 270 L470 270 L470 330" fill="none" stroke="#993C1D" stroke-width="0.9" marker-end="url(#arrow)"/>
<rect x="422" y="276" width="96" height="22" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="470" y="288" text-anchor="middle" dominant-baseline="central" font-family="Malgun Gothic, sans-serif" font-size="11.5" font-weight="600" fill="#712B13">PDF로 판별</text>

<!-- 형식별 처리 caption -->
<text x="320" y="316" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="12" font-weight="600" fill="#6B6A66">③ 판별된 형식에 따라 처리 경로가 나뉨</text>

<!-- Box3A -->
<rect x="40" y="330" width="260" height="118" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="56" y="351" font-family="Malgun Gothic, sans-serif" font-size="14" font-weight="700" fill="#04342C">A. HWP / HWPX인 경우</text>
<text x="56" y="373" font-family="Malgun Gothic, sans-serif" font-size="12.5" fill="#0A4A3D">파일 내부 구조를</text>
<text x="56" y="393" font-family="Malgun Gothic, sans-serif" font-size="12.5" fill="#0A4A3D">직접 해석해서</text>
<text x="56" y="413" font-family="Malgun Gothic, sans-serif" font-size="12.5" fill="#0A4A3D">문단 목록을 바로 뽑아냄</text>

<!-- Box3B -->
<rect x="340" y="330" width="260" height="118" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
<text x="356" y="351" font-family="Malgun Gothic, sans-serif" font-size="14" font-weight="700" fill="#4A1B0C">B. PDF인 경우</text>
<text x="356" y="373" font-family="Malgun Gothic, sans-serif" font-size="12.5" fill="#712B13">별도의 처리 절차를 거쳐</text>
<text x="356" y="393" font-family="Malgun Gothic, sans-serif" font-size="12.5" fill="#712B13">텍스트를 확보함</text>

<!-- merge arrows -->
<path d="M170 448 L170 478 L250 478 L250 500" fill="none" stroke="#5B5876" stroke-width="0.75" marker-end="url(#arrow)"/>
<path d="M470 448 L470 478 L390 478 L390 500" fill="none" stroke="#5B5876" stroke-width="0.75" marker-end="url(#arrow)"/>

<!-- Box4 -->
<rect x="90" y="500" width="460" height="130" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="106" y="521" font-family="Malgun Gothic, sans-serif" font-size="14" font-weight="700" fill="#26215C">④ 공통 후처리 (형식과 무관하게 동일)</text>
<text x="106" y="543" font-family="Malgun Gothic, sans-serif" font-size="12.5" fill="#312A78">- 문단 텍스트를 문장 단위로 자르기</text>
<text x="106" y="563" font-family="Malgun Gothic, sans-serif" font-size="12.5" fill="#312A78">- 이상한 기호/공백 정리(정규화)</text>
<text x="106" y="583" font-family="Malgun Gothic, sans-serif" font-size="12.5" fill="#312A78">- "사건 개요 / 일시 / 장소 / 사고 경위"</text>
<text x="106" y="603" font-family="Malgun Gothic, sans-serif" font-size="12.5" fill="#312A78">  4가지 항목을 찾아 분류</text>

<line x1="320" y1="630" x2="320" y2="657" stroke="#5B5876" stroke-width="0.75" marker-end="url(#arrow)"/>

<!-- Box5 -->
<rect x="140" y="657" width="360" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="320" y="685" text-anchor="middle" dominant-baseline="central" font-family="Malgun Gothic, sans-serif" font-size="14" font-weight="700" fill="#2C2C2A">⑤ 전처리 결과 산출물(JSON) 도출</text>
</svg>
