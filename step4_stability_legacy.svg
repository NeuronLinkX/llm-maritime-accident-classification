<svg width="1000" height="400" viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" role="img">
<title>레거시(대표문장 균일 3건) 설정의 STEP4 모델별·군집별 라벨 재현성(100회 실행)</title>
<desc>4개 모델(Qwen2.5-3B/7B/14B, Llama-3.1-8B)을 대표문장 균일 3건 설정으로 100회 실행해 군집마다 가장 많이 나온 라벨과 그 비율을 정리한 표. 대체로 70% 이상의 안정적인 결과를 보이며, 군집1의 Llama(55%)와 군집3의 3B(51%)·Llama(58%)만 40~70% 구간이다.</desc>
<rect width="1000" height="400" fill="#FFFFFF"/>
<style>
  text { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; fill: #1B2431; }
