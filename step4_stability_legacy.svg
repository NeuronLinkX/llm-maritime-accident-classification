  .label-o { fill: #8A5A1C; }
  .sub { font-size: 12px; text-anchor: middle; }
  .sub-g { fill: #4C7A44; }
  .sub-o { fill: #A6763A; }
  .cap { font-size: 15px; text-anchor: middle; fill: #2C2C2A; }
</style>

